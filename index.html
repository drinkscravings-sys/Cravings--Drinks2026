<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cravings  | Login</title>

    <link rel="stylesheet"
          href="style.css">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at top left,
                    #f8e8c8,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #efe0c4,
                    #d4ad78
                );

            color: #3f281d;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 25px;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 1050px;

            min-height: 650px;

            display: grid;
            grid-template-columns: 1fr 1fr;

            background: rgba(255, 250, 241, 0.96);

            border-radius: 28px;

            overflow: hidden;

            box-shadow:
                0 25px 70px rgba(63, 40, 29, 0.22);
        }

        /* LEFT */

        .auth-brand {
            position: relative;

            padding: 55px;

            display: flex;
            flex-direction: column;
            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #70452d,
                    #3f281d
                );

            color: #fffaf1;
        }

        .auth-brand::after {
            content: "🌰";

            position: absolute;

            right: 35px;
            top: 25px;

            font-size: 90px;

            opacity: 0.12;
        }

        .brand-icon {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .auth-brand h1 {
            margin: 0;

            font-size: 48px;

            letter-spacing: 3px;

            font-family:
                Georgia,
                serif;
        }

        .auth-brand h1 span {
            color: #e7c98b;
        }

        .auth-brand h2 {
            margin-top: 25px;

            font-size: 26px;

            font-family:
                Georgia,
                serif;
        }

        .auth-brand p {
            max-width: 430px;

            line-height: 1.8;

            color: #eadbc8;

            font-size: 15px;
        }

        .brand-line {
            width: 75px;
            height: 4px;

            background: #c88f32;

            border-radius: 20px;

            margin: 22px 0;
        }

        /* RIGHT */

        .auth-box {
            padding: 55px 50px;

            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .auth-heading {
            text-align: center;

            margin-bottom: 30px;
        }

        .auth-heading h2 {
            margin: 0;

            font-family:
                Georgia,
                serif;

            font-size: 32px;

            color: #4a3021;
        }

        .auth-heading p {
            margin-top: 8px;

            color: #806957;

            font-size: 14px;
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .input-group {
            margin-bottom: 17px;
        }

        .input-group label {
            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 700;

            color: #5f402b;
        }

        .input-group input {
            width: 100%;

            height: 48px;

            padding: 0 15px;

            border: 1px solid #d9c4a3;

            border-radius: 10px;

            outline: none;

            background: #fffaf1;

            color: #3f281d;

            font-size: 14px;

            transition: 0.2s;
        }

        .input-group input:focus {
            border-color: #c88f32;

            box-shadow:
                0 0 0 3px
                rgba(200, 143, 50, 0.12);
        }

        .password-box {
            position: relative;
        }

        .password-box input {
            padding-right: 55px;
        }

        .show-password {
            position: absolute;

            right: 12px;
            top: 50%;

            transform: translateY(-50%);

            border: 0;

            background: transparent;

            cursor: pointer;

            font-size: 17px;
        }

        .forgot-row {
            text-align: right;

            margin-top: -5px;

            margin-bottom: 20px;
        }

        .forgot-row button {
            border: 0;

            background: transparent;

            color: #a96f1e;

            cursor: pointer;

            font-size: 13px;

            font-weight: 700;
        }

        .auth-button {
            width: 100%;

            height: 50px;

            border: 0;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #c88f32,
                    #a96f1e
                );

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 8px 20px
                rgba(169, 111, 30, 0.22);

            transition: 0.2s;
        }

        .auth-button:hover {
            transform: translateY(-2px);
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch-text {
            text-align: center;

            margin-top: 22px;

            font-size: 13px;

            color: #806957;
        }

        .switch-text button {
            border: 0;

            background: transparent;

            color: #a96f1e;

            font-weight: 800;

            cursor: pointer;
        }

        .message {
            display: none;

            margin-bottom: 16px;

            padding: 11px 13px;

            border-radius: 8px;

            font-size: 13px;

            line-height: 1.5;
        }

        .message.show {
            display: block;
        }

        .message.error {
            background: #f9e4df;
            color: #a33b2b;
        }

        .message.success {
            background: #e7f0df;
            color: #526b39;
        }

        /* MOBILE */

        @media (max-width: 800px) {

            .auth-wrapper {
                grid-template-columns: 1fr;
                max-width: 500px;
            }

            .auth-brand {
                padding: 35px;
                min-height: 260px;
            }

            .auth-brand h1 {
                font-size: 38px;
            }

            .auth-brand h2 {
                font-size: 21px;
            }

            .auth-brand p {
                display: none;
            }

            .auth-box {
                padding: 40px 30px;
            }
        }

    </style>

</head>


<body>


<div class="auth-wrapper">


    <!-- =========================================
         BRAND SIDE
    ========================================== -->

    <section class="auth-brand">

        <div class="brand-icon">
            
        </div>

        <h1>
            Cravings
            <span>🤎✨ </span>
        </h1>

        <div class="brand-line"></div>

        <h2>
            Freshly Prepared.
            Richly Enjoyed.
        </h2>

        <p>
            Welcome to our Cravings family.
            Register your account to explore our
            products, place orders and track your
            deliveries.
        </p>

    </section>


    <!-- =========================================
         AUTH SIDE
    ========================================== -->

    <section class="auth-box">


        <div class="auth-heading">

            <h2 id="authTitle">
                Welcome Back
            </h2>

            <p id="authSubtitle">
                Login to continue to Cravings
            </p>

        </div>


        <!-- MESSAGE -->

        <div id="authMessage"
             class="message">
        </div>


        <!-- =====================================
             LOGIN
        ====================================== -->

        <form id="loginForm"
              class="auth-form active">

            <div class="input-group">

                <label for="loginEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('loginPassword', this)">
                        👁️
                    </button>

                </div>

            </div>


            <div class="forgot-row">

                <button
                    type="button"
                    id="forgotPasswordBtn">

                    Forgot Password?

                </button>

            </div>


            <button
                type="submit"
                class="auth-button"
                id="loginBtn">

                LOGIN

            </button>


            <div class="switch-text">

                New customer?

                <button
                    type="button"
                    id="showRegisterBtn">

                    Create Account

                </button>

            </div>

        </form>


        <!-- =====================================
             REGISTER
        ====================================== -->

        <form id="registerForm"
              class="auth-form">


            <div class="input-group">

                <label for="registerName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="registerName"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>


            <div class="input-group">

                <label for="registerEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <div class="input-group">

                <label for="registerPassword">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('registerPassword', this)">
                        👁️
                    </button>

                </div>

            </div>


            <div class="input-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword('confirmPassword', this)">
                        👁️
                    </button>

                </div>

            </div>


            <button
                type="submit"
                class="auth-button"
                id="registerBtn">

                REGISTER

            </button>


            <div class="switch-text">

                Already have an account?

                <button
                    type="button"
                    id="showLoginBtn">

                    Login

                </button>

            </div>

        </form>


        <!-- =====================================
             FORGOT PASSWORD
        ====================================== -->

        <form id="forgotPasswordForm"
              class="auth-form">


            <div class="input-group">

                <label for="forgotEmail">
                    Email Address
                </label>

                <input
                    type="email"
                    id="forgotEmail"
                    placeholder="Enter registered email"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-button"
                id="resetPasswordBtn">

                SEND RESET LINK

            </button>


            <div class="switch-text">

                Remember your password?

                <button
                    type="button"
                    id="showLoginFromForgot">

                    Login

                </button>

            </div>

        </form>


    </section>

</div>


<script>

    function togglePassword(inputId, button) {

        const input =
            document.getElementById(inputId);

        if (input.type === "password") {

            input.type = "text";

            button.textContent = "🙈";

        } else {

            input.type = "password";

            button.textContent = "👁️";

        }

    }

</script>

<script type="module" src="js/auth.js"></script>

</body>

</html>
